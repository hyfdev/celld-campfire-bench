<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Workers Chat</title><style>
body{font:16px system-ui;max-width:960px;margin:2rem auto;padding:0 1rem}header,form{display:flex;gap:.6rem;align-items:center}select,input,button,textarea{font:inherit;padding:.6rem}textarea{flex:1}article{border-bottom:1px solid #ddd;padding:.5rem 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}#messages{height:60vh;overflow:auto}#status{color:#666}h2{font-size:1rem}
</style></head><body><h1>Workers Chat</h1><form id="login"><label>User <input id="user" type="number" min="1" max="7" value="1"></label><input id="password" type="password" value="password-1"><button>Log in</button></form><p>Demo accounts: users 1–7, password-N.</p><header><label>Room <select id="room"></select></label><button id="join">Join</button><span id="status">Disconnected</span></header><main id="messages"></main><form id="send"><textarea id="body" required maxlength="8192" placeholder="Write a message"></textarea><button>Send</button></form><script>
let token=localStorage.getItem('chat-token')||'',socket;
const $=id=>document.getElementById(id),headers=()=>({'authorization':'Bearer '+token,'content-type':'application/json','x-chat-cache':'1'});
for(let i=1;i<=50;i++)$('room').add(new Option('Room '+i,i));
function append(m){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');a.dataset.id=m.id;h.textContent=m.user_name||'User '+m.user_id;p.textContent=m.body;a.append(h,p);$('messages').append(a);$('messages').scrollTop=$('messages').scrollHeight;}
$('login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:Number($('user').value),password:$('password').value})});const j=await r.json();if(!r.ok){$('status').textContent=j.error;return;}token=j.token;localStorage.setItem('chat-token',token);$('join').click();};
$('join').onclick=async()=>{socket?.close();const room=$('room').value,r=await fetch('/rooms/'+room+'/messages',{headers:headers()});const j=await r.json();if(!r.ok){$('status').textContent=j.error;return;}$('messages').replaceChildren();j.messages.slice().reverse().forEach(append);socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/rooms/'+room+'/ws?token='+encodeURIComponent(token));socket.onopen=()=>{$('status').textContent='Connected · unread '+j.unread;};socket.onclose=()=>{$('status').textContent='Disconnected';};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.error){$('status').textContent=m.error;return;}append(m);fetch('/rooms/'+room+'/read',{method:'POST',headers:headers()});};await fetch('/rooms/'+room+'/read',{method:'POST',headers:headers()});};
$('send').onsubmit=e=>{e.preventDefault();if(socket?.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({body:$('body').value}));$('body').value='';};
</script></body></html>
