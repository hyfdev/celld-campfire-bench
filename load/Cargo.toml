[package]
name = "workers-chat-load"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
crc32fast = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "workers-chat-ws"
path = "src/ws.rs"

[[bin]]
name = "campfire-original-load"
path = "../experiments/basecamp/load.rs"
